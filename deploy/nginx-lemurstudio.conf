# /etc/nginx/sites-available/lemurstudio.cl
# Sitio canónico: https://www.lemurstudio.cl  (lemurstudio.cl y http redirigen ahí)
# Certificado de Let's Encrypt (certbot) para lemurstudio.cl y www.lemurstudio.cl; se renueva solo.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lemurstudio.cl;

    ssl_certificate /etc/letsencrypt/live/lemurstudio.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lemurstudio.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    # Fotos subidas desde el panel (Next solo sirve los archivos de public/ que existían al compilar)
    location /uploads/ {
        alias /opt/lemur/shared/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lemurstudio.cl;
    ssl_certificate /etc/letsencrypt/live/lemurstudio.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lemurstudio.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.lemurstudio.cl$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name lemurstudio.cl www.lemurstudio.cl;
    return 301 https://www.lemurstudio.cl$request_uri;
}
