# /etc/nginx/sites-available/lemurstudio.cl
# certbot agrega el bloque 443 (HTTPS) cuando el dominio apunte a este servidor.
server {
    listen 80;
    listen [::]:80;
    server_name lemurstudio.cl www.lemurstudio.cl;

    client_max_body_size 12m;

    # Fotos subidas desde el panel (Next solo sirve los archivos de public/ que existían al compilar)
    location /uploads/ {
        alias /opt/lemur/shared/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
